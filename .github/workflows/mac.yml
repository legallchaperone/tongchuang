  #       env:
  #         GH_TOKEN: ${{ github.token }}
  #       run: |
  #         v="${GITHUB_REF_NAME#mac-v}"
  #         cat > notes.md <<'EOF'
  #         下载下面的 zip，解压后把「同窗」拖进「应用程序」。
  #         第一次打开会被系统拦下：到「系统设置 → 隐私与安全性」，拉到下面点「仍要打开」。
  #         熟悉终端也可以运行：xattr -dr com.apple.quarantine /Applications/同窗.app
